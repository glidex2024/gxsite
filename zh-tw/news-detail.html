  <style>
    
    /* 跨平台字體渲染優化 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    
    body {

    /* 頂部導航欄 - 完全按照Pinnacle設計 */

    .navbar.scrolled {
      background: rgba(30, 58, 138, 0.98);
      box-shadow: 0 4px 20px rgba(30, 58, 138, 0.3);

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    /* 修復滾動問題 */
    html, body {
      overflow-x: hidden !important;
      overflow-y: auto !important;
      height: auto !important;
    }
    
    body {
      position: relative !important;
      overflow-x: hidden !important;
      overflow-y: auto !important;
    }
    
    .container {
      position: relative !important;
      overflow: visible !important;
    }
    
    /* 確保內容可以正常滾動 */
    section {

    }

    /* 文本換行與防溢出 */
    #news-title, #news-content {
      word-break: normal;
      overflow-wrap: break-word;
      white-space: normal;
    }
    #news-content {
      white-space: pre-line !important; /* 保留換行 */
      font-size: 1rem;
      line-height: 1.8;
    }
    .container { box-sizing: border-box; }

    /* 詳情頁圖片響應式約束 */
    #news-img {
      width: 100% !important;
      height: auto !important;
      max-height: 520px;          /* 桌面端上限，避免過高 */
      object-fit: contain;        /* 完整顯示圖片，不裁切 */
      object-position: center;
      border-radius: 16px;
      background: var(--color-surface-alt, #f7f8fb);
      display: block;
    }

    @media (max-width: 992px) {
      #news-img { max-height: 420px; }
    }

    @media (max-width: 768px) {
      /* 手機端正文保留段落層級，並避免橫向滾動 */
      body { padding-top: 82px !important; padding-bottom: 40px !important; }
      #news-detail-hero { height: 38svh !important; min-height: 250px !important; }
      #news-title { font-size: clamp(1.5rem, 7vw, 2rem) !important; line-height: 1.25 !important; letter-spacing: 0 !important; max-width: 100%; }
      #news-detail-main { padding: 32px 18px 48px !important; }
      #news-content { white-space: pre-line !important; font-size: 1rem !important; line-height: 1.85 !important; overflow-wrap: break-word !important; word-break: normal !important; }
      footer { padding-bottom: 40px !important; }
      /* 圖片必須完整顯示：基礎規則已用 contain，這裡只按視口收緊高度 */
      #news-img {
        max-height: 60vh !important;     /* 隨視口縮放 */
      }
    }

    @media (max-width: 480px) {
      #news-img { max-height: 50vh !important; }
    }
    
    /* 二維碼彈窗樣式 */
    .qr-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    
    .qr-modal.show {
      opacity: 1;
      visibility: visible;
    }
    
    .qr-modal-content {
      background: var(--snow-white);
      border-radius: 20px;
      padding: 2rem;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      transform: scale(0.8);
      transition: all 0.3s ease;
    }
    
    .qr-modal.show .qr-modal-content {
      transform: scale(1);
    }
    
    .qr-modal-header {
      margin-bottom: 1.5rem;
      position: relative;
    }
    
    .qr-modal-header h3 {
      color: var(--primary-blue);
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    
    .qr-modal-header p {
      color: var(--warm-gray);
      font-size: 1rem;
      margin: 0;
    }
    
    .qr-modal-close {
      position: absolute;
      top: -10px;
      right: -10px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--accent-orange);
      color: var(--snow-white);
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    
    .qr-modal-close:hover {
      background: #c2410c;
      transform: scale(1.1);
    }
    
    .qr-modal-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    
    .qr-image {
      width: 200px;
      height: 200px;
      border-radius: 12px;
      border: 2px solid var(--primary-blue);
      object-fit: cover;
    }
    
    .qr-tip {
      color: var(--warm-gray);
      font-size: 0.9rem;
      margin: 0;
    }
    
    /* 移動端二維碼彈窗樣式 */
    @media (max-width: 768px) {
      body {
        padding-top: 150px;
        padding-bottom: 60px;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }
      
      .qr-modal-content {
        padding: 1.5rem;
        max-width: 350px;
      }
      
      .qr-image {
        width: 180px;
        height: 180px;
      }
      
      .qr-modal-header h3 {
        font-size: 1.3rem;
      }
    }
  </style>

  <script>
    (function(){
      var toggle = document.querySelector('.menu-toggle');
      var nav = document.getElementById('primary-nav');
      var backdrop = document.querySelector('.nav-backdrop');
      if (!toggle || !nav || !backdrop) return;
      function openNav(){ nav.classList.add('show'); toggle.setAttribute('aria-expanded','true'); backdrop.hidden = false; document.body.classList.add('body--nav-open'); }
      function closeNav(){ nav.classList.remove('show'); toggle.setAttribute('aria-expanded','false'); backdrop.hidden = true; document.body.classList.remove('body--nav-open'); }
      toggle.addEventListener('click', function(){ var exp = toggle.getAttribute('aria-expanded')==='true'; exp?closeNav():openNav(); });
      backdrop.addEventListener('click', closeNav);
      window.addEventListener('keydown', function(e){ if(e.key==='Escape') closeNav(); });
      var mql = window.matchMedia('(min-width: 992px)');
      function handle(e){ if(e.matches) closeNav(); }
      if(mql.addEventListener){ mql.addEventListener('change', handle); } else if(mql.addListener){ mql.addListener(handle); }
    })();
  </script>
  <script>
    // 修復滾動問題
    document.addEventListener('DOMContentLoaded', function() {
      // 強制啓用滾動
      document.body.style.overflow = 'auto';
      document.documentElement.style.overflow = 'auto';
      
      // 確保頁面可以正常滾動
      document.body.style.height = 'auto';
      document.documentElement.style.height = 'auto';
      
      // 添加鍵盤滾動支持
      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowDown' || e.key === 'PageDown') {
          e.preventDefault();
          window.scrollBy(0, 100);
        } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
          e.preventDefault();
          window.scrollBy(0, -100);
        }
      });
      
      // 移除阻止默認滾動的代碼，讓瀏覽器自然處理滾動
    });
    
    AOS.init({ duration: 800, once: true });
    window.addEventListener('scroll', function() {
      const navbar = document.getElementById('navbar');
      if (window.scrollY > 60) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });
    // 動態加載消息詳情（靜態json版）
    function getQueryParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }
    const id = getQueryParam('id');
    const languageSwitchLink = document.getElementById('news-language-switch');
    if (id && languageSwitchLink) languageSwitchLink.href = `/news-detail?id=${encodeURIComponent(id)}`;
    fetch('/zh-tw/news.json')
      .then(res => res.json())
      .then(newsList => {
        const data = newsList.find(n => String(n.id) === String(id));
        if (!data) {
          document.getElementById('news-title').textContent = '消息不存在';
          document.getElementById('news-content').textContent = '';
          document.getElementById('news-img').style.display = 'none';
          document.getElementById('news-hero-bg').style.background = '';
          document.getElementById('news-date').textContent = '';
        } else {
          document.getElementById('news-title').textContent = data.title;
          document.getElementById('news-date').textContent = data.date;
          let imgUrl = data.img;
          document.getElementById('news-img').src = imgUrl;
          document.getElementById('news-img').alt = data.title;
          document.getElementById('news-img').style.display = 'block';
          document.getElementById('news-hero-bg').style.background = `linear-gradient(rgba(17,17,17,0.7), rgba(17,17,17,0.7)), url('${imgUrl}') center/cover no-repeat`;
          // 使用文本+保留換行
          document.getElementById('news-content').textContent = '';
          const contentEl = document.getElementById('news-content');
          contentEl.textContent = data.content;
        }
      });

    // 聯繫按鈕交互
    document.addEventListener('DOMContentLoaded', function() {
      const contactMainBtn = document.getElementById('contactMainBtn');
      const contactOptions = document.getElementById('contactOptions');
      
      if (contactMainBtn && contactOptions) {
        contactMainBtn.addEventListener('click', function() {
          contactOptions.classList.toggle('show');
        });
        
        // 點擊外部關閉
        document.addEventListener('click', function(e) {
          if (!contactMainBtn.contains(e.target) && !contactOptions.contains(e.target)) {
            contactOptions.classList.remove('show');
          }
        });
      }
    });

    // 聯繫方式打開函數
    function openWeChat() {
      console.log('打開微信聯繫');
      showQRCode('image/qrcode/1.PNG', 'WeChat', '微信聯繫');
    }
    
    function openLine() {
      console.log('打開LINE聯繫');
      showQRCode('image/qrcode/2.JPG', 'LINE', 'LINE聯繫');
    }
    
    function openWhatsApp() {
      console.log('打開WhatsApp聯繫');
      showQRCode('image/qrcode/3.PNG', 'WhatsApp', 'WhatsApp聯繫');
    }
    function openXHS() {
      console.log('打開小紅書');
      showQRCode('image/qrcode/4.jpeg', '小紅書', '小紅書賬號');
    }
    
    // 顯示預約微信二維碼彈窗
    function showWeChatQR() {
      showQRCode('image/qrcode/1.PNG', '微信預約', '請掃描二維碼添加微信進行課程預約');
    }
    
    // 顯示二維碼彈窗
    function showQRCode(imageSrc, title, subtitle) {
      // 創建彈窗容器
      const modal = document.createElement('div');
      modal.className = 'qr-modal';
      modal.innerHTML = `
        <div class="qr-modal-content">
          <div class="qr-modal-header">
            <h3>${title}</h3>
            <p>${subtitle}</p>
            <button class="qr-modal-close" onclick="closeQRModal()">&times;</button>
          </div>
          <div class="qr-modal-body">
            <img loading="lazy" src="${imageSrc}" alt="${title} QR Code" class="qr-image">
            <p class="qr-tip">請使用手機掃描二維碼</p>
          </div>
        </div>
      `;
      
      // 添加到頁面
      document.body.appendChild(modal);
      
      // 顯示彈窗
      setTimeout(() => modal.classList.add('show'), 10);
      
      // 點擊背景關閉
      modal.addEventListener('click', function(e) {
        if (e.target === modal) {
          closeQRModal();
        }
      });
    }
    
    // 關閉二維碼彈窗
    function closeQRModal() {
      const modal = document.querySelector('.qr-modal');
      if (modal) {
        modal.classList.remove('show');
        setTimeout(() => modal.remove(), 300);
      }
    }

    // 錯誤處理
    window.addEventListener('error', function(e) {
      console.log('頁面加載錯誤:', e.message);
    });

    // 確保內容可見
    window.addEventListener('load', function() {
      document.body.style.opacity = '1';
      // 確保所有內容都可見
      const hiddenElements = document.querySelectorAll('[style*="opacity: 0"]');
      hiddenElements.forEach(el => {
        el.style.opacity = '1';
      });
    });
  </script>
